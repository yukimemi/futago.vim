
# kata-managed — source: yukimemi/pj-denops/.github/workflows/ci.yml.tera
# Local edits are reverted on the next `kata apply`. Push fixes upstream.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2

      - name: Run CI
        shell: bash
        run: deno task ci