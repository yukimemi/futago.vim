name: claude-review

# Automatic Claude Code review — one full pass per human-authored
# PR, at open time (plus ready_for_review / reopened).
#
# Replaces the Gemini Code Assist free-tier PR review (free tier
# discontinued upstream). Runs anthropics/claude-code-action in
# agent mode: the workflow supplies a review prompt, Claude reads
# the diff (and the repo's AGENTS.md conventions) and posts inline
# comments plus a top-level summary.
#
# Cost model: `synchronize` is deliberately NOT in the trigger
# list. Re-reviewing the full diff on every fix push doubled up
# with the @claude responder (claude.yml), which already verifies
# each fix when the author replies on the review thread with an
# @-mention (the AGENTS.md "reply to reviewers" convention) — so
# every fix used to cost a full review AND a focused re-check.
# Now the cycle is: one full review at open, then cheap
# mention-driven re-checks per fix. Need a fresh full pass after
# a large rework? Comment `@claude please re-review the full PR`.
#
# Review-skip policy — mirrors the AGENTS.md "PR review cycle"
# rules so the workflow and the docs agree on which PRs skip the
# bot-review gate:
# - `chore/release-*` version-bump PRs: nothing for a reviewer to
#   find in a version bump, and the release pipeline downstream of
#   merge (auto-tag → release.yml, shipped by language layers like
#   pj-rust-cli) is time-sensitive.
# - `kata-apply/auto` / `apm-bump/auto` rolling branches: rendered
#   template / lock refreshes, auto-merged when CI passes.
# - Renovate / Dependabot PRs: bot-authored dependency bumps skip
#   the bot-review gate per AGENTS.md.
# - Draft PRs: review fires once marked ready (`ready_for_review`).
#
# `.tera` suffix: same dual purpose as the other workflow templates
# here — keeps GHA from auto-running the source inside pj-base, and
# opts the file into kata's Tera rendering for the
# `{{ vars.actions.* }}` action-version pins.
#
# Setup requirement on every consumer (one-time):
# 1. Install the Claude GitHub App (github.com/apps/claude) on the
#    repo (or org) — the action exchanges an OIDC token against it.
# 2. `CLAUDE_CODE_OAUTH_TOKEN` repo secret — generate locally with
#    `claude setup-token` (requires a Claude Pro/Max subscription).
#    Pay-as-you-go alternative: store `ANTHROPIC_API_KEY` instead
#    and swap the input below to `anthropic_api_key`.
#
# The credential check below exists because step 2 fails SILENTLY
# otherwise: handed an empty token, claude-code-action exits 0
# without posting anything, so the check turns green and the PR
# looks reviewed when nothing ran. That is worse than a red X — it
# went unnoticed on yukimemi/rvpm.nvim until the run log was read
# by hand. Fail loudly instead.
#
# EXPECTED whenever a PR's copy of this file differs from the one
# on the default branch: the action logs "Skipping action due to
# workflow validation" and exits 0 without reviewing.
# claude-code-action requires byte-identical content on the default
# branch, otherwise a PR could rewrite the workflow to exfiltrate
# the token. Two cases hit it:
#   1. the PR that first adopts these templates, and
#   2. any later PR that EDITS this file — e.g. hand-pulling an
#      upstream fix into a consumer repo.
# The second is the surprising one and reads like a regression; it
# is not. Either way the check is green with no review attached.
# Nothing to fix; merge on CI + owner approval, and reviews resume
# on the next PR that leaves the workflows alone.
#
# Telling the two silent-green cases apart: no credential -> RED
# (the guard below), workflow validation -> GREEN with no review.
#
# `when = "always"` (in template.toml): every consumer wants
# identical review behaviour; fixes to the workflow itself flow
# automatically on next apply.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  # One review per PR at a time; a re-fire (reopen / ready)
  # supersedes an in-flight run (reviewing a stale diff is wasted
  # tokens).
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip release bumps, rolling bot branches, bot authors and
    # drafts — see the header comment for the per-line rationale.
    if: |
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'chore/release-') &&
      github.head_ref != 'kata-apply/auto' &&
      github.head_ref != 'apm-bump/auto' &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # The action's SDK caps runs at 10 agent turns, but has no
    # wall-clock timeout of its own; bound a hung run well below
    # GHA's 360-minute default. 45 rather than 30 because the review
    # may now compile the project to check a claim, from a cold cache.
    timeout-minutes: 45
    steps:
      # Fail fast when the consumer never set a credential. Without
      # this the run is a green no-op (see header) — the one failure
      # mode of this workflow that produces no visible signal at all.
      #
      # Accepts EITHER credential: `CLAUDE_CODE_OAUTH_TOKEN` (the
      # subscription path this workflow wires up by default) or
      # `ANTHROPIC_API_KEY` (the pay-as-you-go path the header
      # documents, where the consumer also swaps the input below to
      # `anthropic_api_key`). Checking only the former would hard-fail
      # a consumer who followed the documented alternative.
      #
      # Read via env rather than inlining the expressions into the
      # script, so the values are never substituted into the shell
      # source.
      - name: Check review credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ] && [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error title=claude-review is not configured::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set on ${{ github.repository }}. Subscription path: generate a token with 'claude setup-token' and store it with 'gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo ${{ github.repository }}'. Pay-as-you-go path: set ANTHROPIC_API_KEY instead and swap the action input to anthropic_api_key. Either way, also install the Claude GitHub App (github.com/apps/claude). Until then no PR in this repo is being reviewed."
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          # persist-credentials stays ON (the default) on purpose: the
          # action's setupBranch runs `git fetch origin <branch>` BEFORE
          # it configures its own git auth, so with the credential
          # scrubbed the fetch dies with "could not read Username for
          # 'https://github.com'" on private repos — public repos only
          # survive because the anonymous fetch happens to succeed
          # (anthropics/claude-code-action#1236). The App token the
          # action exchanges covers API calls, not that first fetch.

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Tracking comment with progress checkboxes; also pulls
          # full PR context (comments, attachments) into the run.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness bugs first,
            then code quality. Follow the repository's AGENTS.md
            conventions where they apply.

            Focus areas, in priority order:
            - Correctness: logic errors, edge cases, error handling
            - Security: input validation, secrets handling
            - Maintainability: readability, duplication, dead code
            - Tests: coverage for the changed behaviour

            You can run this project's own verification commands
            (`cargo make check` / `cargo test` / `bun test` and the
            like). Use them when a finding is worth confirming — a
            reviewer who ran the test is worth more than one who
            inferred from the diff — and say which you ran. Keep it
            targeted: a cold full build costs minutes, so reach for
            the narrowest command that settles the question, and
            don't build at all for findings the diff already proves.

            Post specific issues as inline comments on the relevant
            lines. Use one top-level comment for the overall
            summary. Be concise — no praise padding; if the PR is
            clean, say so briefly.
          # Scope Claude to reading the PR, commenting, and running the
          # project's own verification commands. It must not push code.
          #
          # The build/test entries let a reviewer CHECK a claim instead
          # of reasoning about it — "this breaks the tests" is worth
          # far more when the reviewer ran them. Without these the
          # agent can only read the diff and infer, and it says so.
          #
          # Not a new exposure: `on: pull_request` (not
          # `pull_request_target`) means a fork PR gets no secrets and
          # the credential guard fails the job, so only in-repo
          # branches reach this — and `ci.yml` already runs
          # `cargo make check` on that same commit. Executing the
          # branch's code here grants nothing CI didn't already.
          #
          # Verbs are enumerated rather than `Bash(cargo:*)` /
          # `Bash(bun:*)` on purpose. The review job reads untrusted PR
          # content (a diff, its own AGENTS.md), so a prompt-injection
          # attempt inside a diff shouldn't be able to reach
          # `cargo run` / `cargo publish` / `bun x`.
          #
          # `bun run` is pinned to named scripts rather than left as
          # `bun run:*` for a sharper reason: `bun run -` EXECUTES
          # STANDARD INPUT. That is the one primitive here that runs
          # code which never existed in the repository — everything
          # else (a test, a build script, a `cargo make` task) can only
          # run what the PR itself contains, which CI already runs on
          # the same commit. A payload the agent merely *read* while
          # reviewing must not be reachable.
          #
          # Compiling still executes build.rs and test code, so the
          # rest of this list bounds intent rather than capability.
          # That is the accepted trade; the stdin path is not.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cargo make:*),Bash(cargo test:*),Bash(cargo clippy:*),Bash(cargo check:*),Bash(cargo fmt:*),Bash(bun install:*),Bash(bun test:*),Bash(bun run build:*),Bash(bun run test:*),Bash(bun run lint:*),Bash(bun run check:*),Bash(bun run typecheck:*)"
